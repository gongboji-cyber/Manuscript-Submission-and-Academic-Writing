name: Software copyright skill tests
on:
  pull_request:
    paths:
      - '软著制作/**'
      - '.github/workflows/software-copyright-skill-tests.yml'
  push:
    paths:
      - '软著制作/**'
      - '.github/workflows/software-copyright-skill-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run only synthetic offline evidence-extractor tests
        run: python -m unittest discover -s '软著制作/tests' -v
