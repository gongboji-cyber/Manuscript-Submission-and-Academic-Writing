interface:
  display_name: 科研选题全流程发现与严审
  short_description: 从海量线索组合新命题，完成创新性、可识别性与数据交集开题审计
  default_prompt: 使用 $research-topic-selection 一轮完成多来源科研线索搜寻、主动组合、分层筛选与存活课题 G0–G4 全套开题资格审计。严读最近邻全文，核对数学可识别性、联结后的有效独立证据、强基线与冻结试点，双向防止误 GO/误 STOP；允许零 GO，标明未执行的实验，并逐题输出唯一裁决及最小解锁条件。
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
